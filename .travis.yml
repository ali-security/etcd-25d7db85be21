language: go
go_import_path: go.etcd.io/etcd/v3

sudo: required

services: docker

go:
  - "1.16.3"

notifications:
  on_success: never
  on_failure: never

# Sealed build: only the unit leg runs. linux-amd64-coverage (make docker-test-coverage:
# full e2e suite in the gcr.io etcd-test image + Codecov upload) is dropped, and with it the
# docker pull before_install that only that leg used; `tip` is replaced by the release-era
# Go 1.16.3 and allow_failures is removed so a red leg fails the build.
env:
  matrix:
    - TARGET=linux-amd64-fmt-unit-go-tip-2-cpu

install:
  - date

script:
  - date
  - echo "TRAVIS_GO_VERSION=${TRAVIS_GO_VERSION}"
  - >
    case "${TARGET}" in
      linux-amd64-coverage)
        sudo HOST_TMP_DIR=/tmp TEST_OPTS="VERBOSE='1'" make docker-test-coverage
        ;;
      linux-amd64-fmt-unit-go-tip-2-cpu)
        GOARCH=amd64 PASSES='unit' CPU='2' RACE='false' ./test.sh -p=2
        ;;
    esac
